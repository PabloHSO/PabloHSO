<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pablo Henrique Silveira | Resume</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="Professional resume of Pablo Henrique Silveira. Backend Engineer specialized in Python, APIs, data and cloud." />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: radial-gradient(circle at top, #0b1020, #050812);
      color: #e5e7eb;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .resume-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 20px 80px;
    }

    section {
      margin-bottom: 90px;
    }

    section h3 {
      font-size: 2rem;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    section h3 i {
      color: #818cf8;
    }

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 26px;
    }

    .cert-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 26px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: .75rem;
      font-weight: 600;
      border-radius: 999px;
      margin-top: 10px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
    }

    .badge.aws {
      color: #fbbf24;
      border-color: rgba(251,191,36,.4);
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 32px;
      font-size: .85rem;
      background: #020617;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<div class="resume-container reveal">

  <section>
    <h3><i class="ri-award-line"></i> Licenses & Certifications</h3>

    <div class="cert-grid">

      <div class="cert-card">
        <h4>AWS Certified Cloud Practitioner (CLF-C02)</h4>
        <span>Udemy · Oct/2025</span>
        <span class="badge aws">
          <i class="ri-cloud-line"></i> AWS Certified
        </span>
        <p>AWS, Lambda, S3, DynamoDB, CloudFormation, CloudFront</p>
      </div>

      <div class="cert-card">
        <h4>Practitioner — Generative AI</h4>
        <span>Itaú Unibanco · Jun/2025</span>
        <p>Generative AI, Agents, Prompt Engineering</p>
      </div>

    </div>
  </section>

</div>

<footer>
  © 2026 • Pablo Henrique Silveira
</footer>

<script src="js/animations.js"></script>

</body>
</html>
